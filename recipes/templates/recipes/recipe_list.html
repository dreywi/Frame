{% extends "base.html" %}

{% block title %}Рецепты - Recipe Service{% endblock %}

{% block content %}
    <h1>Рецепты</h1>
    <p>Всего рецептов: {{ recipes|length }}</p>
    {% for recipe in recipes %}
        {% include "recipes/includes/recipe_card.html" %}
    {% empty %}
        <p>Рецепты не найдены.</p>
    {% endfor %}
{% endblock %}
